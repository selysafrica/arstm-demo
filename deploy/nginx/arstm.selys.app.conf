# -----------------------------------------------------------------------------
# arstm.selys.app — vhost public, phase 2 (HTTPS avec Let's Encrypt)
#
# Installé par `make nginx-ssl`, une fois le certificat obtenu par `make certbot`.
# Reverse proxy vers le serveur applicatif interne 127.0.0.1:__PORT__.
# -----------------------------------------------------------------------------

# HTTP : challenge ACME (renouvellement) + redirection vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root __ACME_ROOT__;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    # « http2 » sur la directive listen : compatible nginx 1.18 → 1.2x (Ubuntu 22.04 / 24.04)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:arstm_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # En-têtes de sécurité (ET-SEC-01/02)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/arstm.selys.app.access.log;
    error_log  /var/log/nginx/arstm.selys.app.error.log warn;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
