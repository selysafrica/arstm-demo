# -----------------------------------------------------------------------------
# ARSTM demo — serveur applicatif interne (port 3439)
#
# Sert le build Angular (SPA) uniquement en local, sur 127.0.0.1:3439.
# Le vhost public (arstm.selys.app) fait office de reverse proxy vers ce port.
# Variables remplacées par `make nginx-init` : __PORT__, __WEB_ROOT__
# -----------------------------------------------------------------------------
server {
    listen 127.0.0.1:__PORT__;
    server_name _;

    root __WEB_ROOT__;
    index index.html;

    access_log /var/log/nginx/arstm-app.access.log;
    error_log  /var/log/nginx/arstm-app.error.log warn;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml image/svg+xml font/woff2;

    # Fichiers générés par Angular (noms hachés) : cache long et immuable
    location ~* ^/(?:chunk|main|polyfills|styles)-[A-Za-z0-9_-]+\.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Autres fichiers statiques : 404 s’ils n’existent pas (pas de repli sur index.html)
    location ~* \.(?:js|css|map|json|txt|xml|webmanifest)$ {
        try_files $uri =404;
    }

    # Images, polices, icônes du dossier public/
    location ~* \.(?:png|jpe?g|webp|avif|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # index.html ne doit jamais être mis en cache (sinon les nouveaux builds ne sont pas vus)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA : toutes les routes Angular (/admin, /espace, /formations/esn…) renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
