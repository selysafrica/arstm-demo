# -----------------------------------------------------------------------------
# ARSTM demo — serveur nginx DANS le conteneur Docker (port 3439)
#
# Image : nginxinc/nginx-unprivileged (processus non root).
# Docker publie ce port uniquement sur 127.0.0.1:3439 de l’hôte ; le vhost public
# arstm.selys.app (nginx de l’hôte + certbot) fait le reverse proxy et le TLS.
# Logs : stdout/stderr (docker compose logs).
# -----------------------------------------------------------------------------
server {
    listen 3439;
    listen [::]:3439;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Le TLS et les en-têtes de sécurité sont gérés par le nginx de l’hôte.
    server_tokens off;
    # Le proxy de l’hôte transmet l’IP réelle du visiteur
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml image/svg+xml font/woff2;

    # Sonde de santé du conteneur
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fichiers générés par Angular (noms hachés) : cache long et immuable
    location ~* ^/(?:chunk|main|polyfills|styles)-[A-Za-z0-9_-]+\.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Autres fichiers statiques : 404 s’ils n’existent pas (pas de repli sur index.html)
    location ~* \.(?:js|css|map|json|txt|xml|webmanifest)$ {
        try_files $uri =404;
    }

    # Images, polices, icônes du dossier public/
    location ~* \.(?:png|jpe?g|webp|avif|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # index.html jamais en cache (sinon les nouveaux builds ne sont pas vus)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA : toutes les routes Angular renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
