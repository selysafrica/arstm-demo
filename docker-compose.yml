# =============================================================================
# ARSTM demo — Docker Compose
#
#   docker compose up -d --build      # construit l’image et démarre le conteneur
#
# Le conteneur n’écoute que sur 127.0.0.1:$PORT de l’hôte (3440 par défaut, défini dans .env) : il n’est pas exposé
# sur Internet. Le nginx de l’hôte (vhost arstm.selys.app + certbot) fait le
# reverse proxy HTTPS vers ce port (voir deploy/README.md).
# =============================================================================
name: arstm

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: arstm-demo:${IMAGE_TAG:-latest}
    container_name: arstm-web
    restart: unless-stopped
    # Réseau « bridge » par défaut de Docker (docker0) : aucun réseau dédié n’est créé.
    # Évite l’erreur « all predefined address pools have been fully subnetted »
    # sur un serveur qui héberge déjà beaucoup de projets Docker.
    network_mode: bridge
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-3440}:8080"
    # Système de fichiers en lecture seule : seul /tmp (pid, caches nginx) est inscriptible
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
