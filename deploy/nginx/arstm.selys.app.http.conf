# -----------------------------------------------------------------------------
# arstm.selys.app — vhost public, phase 1 (HTTP uniquement, avant le certificat)
#
# Installé par `make nginx-init`. Permet :
#   - à certbot de valider le domaine (challenge HTTP-01 dans __ACME_ROOT__) ;
#   - d'accéder déjà au site en HTTP, proxifié vers 127.0.0.1:__PORT__.
# Remplacé par arstm.selys.app.conf (HTTPS) lors de `make nginx-ssl`.
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root __ACME_ROOT__;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
